name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The Python 3.11 runner images ship setuptools 65.5.0, which has
          # known advisories. It is a build tool and not something users of
          # this package ever receive, but pip-audit scans the whole
          # environment, so upgrade it rather than silencing the finding.
          python -m pip install --upgrade "setuptools>=78.1.1"
          pip install -e ".[dev]"
          pip install pyttsx3

      - name: Pre-release checks
        # Runs the test suite, pip-audit, stdout purity, a dangerous-call scan,
        # the tool catalog budget and the counter privacy check. Exits non-zero
        # on failure, so this gates the merge.
        run: python pre_release_check.py

      - name: Build package
        run: |
          pip install build
          python -m build
          python -m twine check dist/*

      - name: Verify the console script answers over stdio
        run: python -c "import mcp_voice_summary as m; print(m.main.__doc__ is not None)"